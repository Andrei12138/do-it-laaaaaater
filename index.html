<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#34495e" />
    <script>
      (() => {
        const key = 'do-it-laaaaaater.theme.v1'
        const allowed = ['flat-2013', 'animal-island', 'grid-paper']
        let theme = 'flat-2013'
        try {
          const stored = window.localStorage.getItem(key)
          if (stored && allowed.includes(stored)) theme = stored
        } catch {
          // Storage can be disabled; Flat Design 2013 remains the default.
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Kalam:wght@400;700&family=Noto+Sans+SC:wght@400;500;700&family=Nunito:wght@500;700;900&family=Patrick+Hand&family=Shadows+Into+Light&display=swap"
      rel="stylesheet"
    />
    <title>Do It Laaaaaater</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
